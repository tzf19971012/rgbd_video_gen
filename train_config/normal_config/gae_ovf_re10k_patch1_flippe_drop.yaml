# =============================================================================
# 实验 — concat@pixel(14) x patch1 + condition dropout + pose-CFG（解耦糊的变量）
#
# 与 gae_ovf_re10k_aux0_upsample2_concatpixel.yaml（anchor）逐位一致，唯一
# 变量 = 打开 condition dropout 训练 + 推理端 CFG：
#   camera_drop_prob: 0.2   # 训练端 strip 相机条件（concat 模式下 =
#                           # plucker 通道块置零，_build_flow_input 已补）
#   ref_drop_prob:    0.2   # 训练端 strip source 证据（clean latent -> noise）
#   eval_cfg_scale:   1.5   # 推理端 v = v_uncond + 1.5*(v_cond - v_uncond)，
#                           # uncond 分支与训练端 cam_drop+ref_drop 组合严格一致
#
# 动机：concatpixel（无 drop）训出的模型相机控制仍弱（轨迹外推 d1 后半段
# ~0.37-0.43，pred 粘在 source 附近）；CFG 无从放大不存在的条件响应——
# 只有训练期见过无条件分支，(v_cond - v_uncond) 才被校准成"相机方向"。
# GAE 官方 flow_gae128 协议即 camera_drop 0.2 / ref_drop 0.2。
#
# 判据（同 8 场景、同 8050 步、同 seed 42）：
#   * 主判据 = tools/diag_pose_sensitivity.py swap_tgt 敏感度（vs anchor）；
#   * 轨迹外推（examples.wanvideo.model_training.infer_trajectory）：
#     后半段 d1 / 视觉跟随是否显著改善；cfg 扫描 1.0/1.5/2.0 曲线；
#   * LPIPS/PSNR 不应显著劣化（drop 是正则，通常略降 PSNR 升 LPIPS）。
#
# 训练端 drop 代码前提（已补）：WanRGBDNVSTrainingModule._build_flow_input 的
# cam_drop 分支在 plucker_block 存在时按 batch 元素置零整个通道块（add 模式
# 不受影响——其条件经 view_condition 加性进入，原有逻辑已覆盖）。
# =============================================================================

wan_model_root: "/mnt/sfs_turbo/t00845730/wan21"
skip_download: true
output_path: "logs/ovf_gae_re10k_patch1_flippe_drop"

model_id_with_origin_paths: "Wan-AI/Wan2.1-T2V-1.3B:diffusion_pytorch_model*.safetensors"
trainable_models: "dit"
remove_prefix_in_ckpt: "pipe.dit"
mode: regression
denoise_step: 0.5

# --- GAE latent backend ------------------------------------------------------
gae_cache_root: "/mnt/sfs_turbo/t00845730/gae_latent_cache"
gae_dataset_name: "re10k_train"
gae_stats_path: null
gae_rope_frame_axis: "view"
gae_auto_flow_shift: false
rgb_flow_shift: 4.5                  # 与 anchor 一致，train/eval 自洽
vae_encoding_mode: "independent"

# --- tokenization（与 anchor 一致）--------------------------------------------
gae_patch_mode: "patch1"             # patch1 判决实验已证 (1,1,1) 才不糊；token 1296/view 与 upsample2 相同

# --- 相机注入 + condition dropout（本实验唯一变量组）---------------------------
# GAE 忠实复刻: 射线场不再进输入端, 而是以 Plücker Flip PE 逐层加在
# 每个 block 的 self-attention Q/K 上(RMSNorm 对齐 + 公制尺度门控 +
# 零初始化输出层); view_condition_mode 保持 add 但在 flip_pe 路径下被置零。
view_condition_mode: "add"
view_condition_plucker_resolution: "latent"  # FlipPE 消费 latent 栅格 6ch 射线场
camera_drop_prob: 0.2                # GAE flow_gae128 协议：训练端 strip 相机条件
ref_drop_prob: 0.2                   # 训练端 strip source 证据
eval_cfg_scale: 1.5                  # 推理端 pose-CFG（uncond 分支与训练端一致）

# --- Plücker Flip PE（GAE camera.py V13 忠实移植）------------------------------
gae_plucker_flip_pe: true
gae_plucker_pe_mlp_hidden: 64        # 7 -> 64 -> dim, 输出层零初始化
gae_plucker_pe_scale: 1.0            # 可学习 alpha_q/alpha_k 初值
gae_plucker_pe_log_scale_aug_prob: 0.3
gae_plucker_pe_log_scale_aug_range: [-1.2, 1.6]

# --- sigma 采样分布（与 anchor 一致）------------------------------------------
rgb_flow_timestep_sampling: "logit_normal"
rgb_flow_logit_mean: -1.5
rgb_flow_logit_std: 1.0

# --- RGB aux loss（保持关闭，隔离变量）----------------------------------------
gae_rgb_loss_weight: 0.0
gae_rgb_t_max: 0.4
gae_rgb_max_views: 1

# --- 主损失加权（与 anchor 逐位一致：均匀 v-MSE）-------------------------------
v_loss_t_eps: 1.0

# --- 新层学习率（与 anchor 一致；concat 下 patch_embedding 含 plucker 切片）----
fresh_layer_lr_mult: 5.0

# --- training ----------------------------------------------------------------
train_all: false
lora_base_model: "dit"
lora_rank: 128
lora_target_modules: "q,k,v,o,ffn.0,ffn.2"
learning_rate: 1.0e-4
warmup_steps: 0
gradient_accumulation_steps: 2      # 与 anchor 一致：bs2x2 有效 batch 8
batch_size: 2
num_epochs: 1000000
max_steps: 8050
mixed_precision: "bf16"
use_gradient_checkpointing: true
use_gradient_checkpointing_offload: false
clip_grad_norm: true
log_step: 10
validate_step: 200
resume: false
training_state_dir: "na"
global_step: 0
seed: 42

# --- views -------------------------------------------------------------------
num_source_views: 6
num_target_views: 3
random_permute_source_views: true
view_order: "random"

# --- resolution --------------------------------------------------------------
resolution: [378, 672]

# --- data: RealEstate10K overfit subset（与 anchor 完全相同的 8 场景）----------
kubric4d_root: "/mnt/sfs_turbo/t00845730/re10k/extracted"
manifest_path: "/mnt/sfs_turbo/t00845730/re10k/manifest_train.jsonl"
disparity_norm_mode: "metric"
min_view_valid_fraction: 0.0
samples_per_scene: 8
num_train_samples: 8
dataloader_num_workers: 4

# --- eval --------------------------------------------------------------------
eval_max_samples: 8
eval_batch_size: 2
eval_view_seed: 1234
eval_num_inference_steps: 25
eval_lpips_net: "alex"
eval_sample_seed: 1234
max_checkpoints: 6
