# ===========================================================================
# re10k-only 1.3B warpbi arm：与 re10k13b_nvs_lora_rand.yaml 唯一差异是
# warp_splat_footprint: "bilinear"（splat 落点 2x2 双线性足迹，
# utils/warp.py footprint="bilinear"；基线缺省为 nearest）。
# 单变量对照：回答 "bilinear 足迹（填补裂隙、连续 coverage 掩码）
# 相对 nearest 落点是否带来收益"。基线跑：logs/re10k13b_rand20261023_011303。
#
# 两 arm 对齐约定（除 warp_splat_footprint 外逐字段一致，否则归因无效）：
#   * Wan2.1-T2V-1.3B + 全新 LoRA r32：resume=false，两 arm 同一起点
#   * re10k-only 数据，max_steps=3000，batch_size 8 x accum 1（6 卡全局 48）
#   * seed=42（第二 seed：YUNDAO_SEED=43 或 dotlist seed=43）
#   * eval 采样 seed 一致（eval_view_seed/eval_sample_seed=1234），指标才可比
#
# 云道启动（每实验 6 卡，与基线同入口）：
#   YUNDAO_RUN_PREFIX=re10k13b_randbi \
#   bash train_script/yundao_train_re10k13b_rand.sh \
#       train_config/normal_config/re10k13b_nvs_lora_rand_warpbi.yaml
# 结果对比（逐 eval step 的指标差值表）：
#   python tools/compare_warp_arms.py \
#       --baseline logs/re10k13b_rand20261023_011303 \
#       --arm logs/re10k13b_randbi<时间戳>
# ===========================================================================
model_id_with_origin_paths: "Wan-AI/Wan2.1-T2V-1.3B:diffusion_pytorch_model.safetensors,Wan-AI/Wan2.1-T2V-1.3B:Wan2.1_VAE.pth"

wan_model_root: "/mnt/sfs_turbo/t00845730/wan21"
skip_download: true
sample_data_root: "/mnt/sfs_turbo/t00845730/re10k"
kubric4d_root: ${sample_data_root}/extracted
manifest_path: ${sample_data_root}/manifest_train.jsonl
output_path: "logs/re10k13b_nvs_lora_rand_warpbi"

strip_i2v_image_input: false

mode: rgbd_nvs
training_target: "x"
denoise_step: 0.5
training_scheduler_timesteps: 1
validation_scheduler_timesteps: 1

trainable_models: "dit"
train_all: false
lora_base_model: "dit"
lora_rank: 32
lora_target_modules: "q,k,v,o,ffn.0,ffn.2"

mixed_precision: "bf16"
learning_rate: 1.0e-4
warmup_steps: 100
lr_decay_steps: 0
lr_min: 0.0

num_epochs: 1000000
max_steps: 3000
max_train_steps: 3000
log_step: 10
clip_grad_norm: true
use_gradient_checkpointing: true
use_gradient_checkpointing_offload: false

resume: false
global_step: 0

scene_filter: null
split_path: null
train_split: null
eval_split: null
min_view_valid_fraction: 0.0

resolution: [384, 672]
num_source_views: 6
num_target_views: 3
vae_encoding_mode: "independent"
random_permute_source_views: true
init_dvd_ckpt: null

disparity_norm_mode: "shared_scale"
disparity_norm_quantile: 0.98
disparity_norm_headroom: 1.5

view_condition_plucker_resolution: "pixel"
view_condition_pixel_scale: 8
view_condition_mode: "concat"
view_condition_normalize_moment: true
view_condition_use_role: false

# a-sweep a8: latent scaling + sequence token layout + splat warp channel.
latent_scale: 1.94
depth_latent_scale: 1.68
token_layout: "sequence"
warp_mode: "splat"
warp_dropout_prob: 0.5
warp_two_pass: true

# ---- warpbi arm 的唯一变量：splat 落点用 2x2 双线性足迹（缺省 nearest）----
warp_splat_footprint: "bilinear"

warp_perturb_prob: 0.0
warp_perturb_gain_log_std: 0.34
warp_perturb_shift_std: 0.059
warp_perturb_blur_sigma: 2.0
warp_perturb_lowfreq_std: 0.05
warp_perturb_lowfreq_cells: 6
warp_perturb_fill_invalid: true
warp_perturb_fill_scale: 1.0
per_frame_timestep: true
depth_warp_block: false

rgb_flow_matching: true
rgb_flow_shift: 5.0
rgb_flow_timestep_sampling: "logit_normal"
rgb_flow_logit_mean: 0.0
rgb_flow_logit_std: 1.0

depth_flow_matching: true
depth_head_init: "pretrained"

rgb_loss_weight: 1.0
depth_loss_weight: 1.0
rgb_loss_type: "mse"
depth_loss_type: "mse"

depth_consist_scale_weight: 0.0
depth_consist_repro_weight: 0.0
depth_consist_sigma_max: 0.6
depth_consist_num_views: 3
depth_consist_max_samples: 2
depth_consist_min_support: 0.02
depth_consist_ratio_clip: 4.0
depth_consist_trim_quantile: 0.9
depth_consist_vae_checkpoint: true

clean_source_depth: false
clean_source_depth_prob: 0.5
shared_rope_frame_ids: false
rope_frame_axis: null
rope_pose_translation_scale: null
roce: "off"
camera_geometry_fp32: false

view_order: "random"

samples_per_scene: 10

batch_size: 8
gradient_accumulation_steps: 1
dataloader_num_workers: 4

seed: 42

# --- Eval（与基线一致：同 seed 同采样，指标可比）---
validate_step: 100
init_validate: false
eval_max_samples: 8
eval_batch_size: 2
eval_view_seed: 1234
eval_sample_seed: 1234
eval_num_inference_steps: 25
eval_flow_shift: 0.5
eval_vis_downscale: 2
eval_vis_format: "jpg"
eval_vis_chunks: 2
max_checkpoints: 8
