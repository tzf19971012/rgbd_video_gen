# =============================================================================
# 实验三（A1 判决）— 去掉 RGB aux loss，其余协议与 aux_fix arm 完全一致
#
# 背景（A 组消融，唯一变量 = aux 开关）：
#   * aux_fix arm（logs/ovf_gae_re10k_rgb_aux_fix）：w=2.0 @ t_max=0.95，
#     eval 目标视角高频能量 grad_e 卡 0.0013 平台（GT latent 上限 0.00217）
#   * 诊断结论：高 sigma 处 x_pred 解码即条件均值图，对其做 L1 = 均值教师，
#     把 MSE 固有的均值塌缩主动固化（GAE 官方 shipped 配置 rgb_loss_weight=0.0，
#     官方 rgb_t_max 默认 0.4）
#
# 本 arm：gae_rgb_loss_weight 2.0 -> 0.0（t_max 0.95 -> 0.4 仅卫生性对齐官方，
# weight=0 时不生效）。sigma 分布（logit_mean=-1.5）/shift 4.5/fresh lr 5x/
# LoRA r128/8 场景/seed 42 全部与 aux_fix 一致，直接同 eval 协议对比。
#
# 判据（同 8 场景、同 eval 25 步 shift 4.5）：
#   * 目标视角 grad_e 是否突破 0.0013 平台、向 0.00217 靠拢 -> aux 是主因
#   * 若仍卡 0.0013 -> 容量假设（下一步 A2 = aux0 + train_all）
#   * 防灰塌缩监控：PSNR 飙高同时 LPIPS 崩向 0.75+（bmvs arm A 老病）
# =============================================================================

wan_model_root: "/mnt/sfs_turbo/t00845730/wan21"
skip_download: true
output_path: "logs/ovf_gae_re10k_rgb_aux0"

model_id_with_origin_paths: "Wan-AI/Wan2.1-T2V-1.3B:diffusion_pytorch_model*.safetensors"
trainable_models: "dit"
remove_prefix_in_ckpt: "pipe.dit"
mode: regression
denoise_step: 0.5

# --- GAE latent backend ------------------------------------------------------
gae_cache_root: "/mnt/sfs_turbo/t00845730/gae_latent_cache"
gae_dataset_name: "re10k_train"
gae_stats_path: null
gae_rope_frame_axis: "view"
gae_auto_flow_shift: false
rgb_flow_shift: 4.5                  # 与 aux_fix arm 一致，train/eval 自洽
vae_encoding_mode: "independent"

# --- sigma 采样分布（与 aux_fix 一致）-----------------------------------------
rgb_flow_timestep_sampling: "logit_normal"
rgb_flow_logit_mean: -1.5
rgb_flow_logit_std: 1.0

# --- RGB aux loss（本实验唯一主变量）------------------------------------------
gae_rgb_loss_weight: 0.0        # 2.0 -> 0.0：拿掉均值教师
gae_rgb_t_max: 0.4              # 惰性参数（weight=0 不触发），对齐官方默认
gae_rgb_max_views: 1

# --- 主损失加权（A1 必须保持与 aux_fix 逐位一致）------------------------------
# 工作区未提交改动给 v-MSE 加了 w=1/max(sigma, v_loss_t_eps)^2。恒等式：
# 均匀 v-MSE 本身就等效 x 空间 1/t^2 权重（GAE x-pred 配方即为此式），
# 再乘 1/t^2 会变成 1/t^4。v_loss_t_eps=1.0 -> clamp 后 w=1/max(sigma,1)^2=1，
# 精确还原均匀 v-MSE（trainer 侧 w==1 退化为 _masked_mse），不动队友代码。
v_loss_t_eps: 1.0

# --- 新层学习率（与 aux_fix 一致）---------------------------------------------
fresh_layer_lr_mult: 5.0        # patch_embedding + head: 1e-4 -> 5e-4，LoRA 维持 1e-4

# --- training ----------------------------------------------------------------
train_all: false
lora_base_model: "dit"
lora_rank: 128
lora_target_modules: "q,k,v,o,ffn.0,ffn.2"
learning_rate: 1.0e-4
warmup_steps: 0
gradient_accumulation_steps: 1
batch_size: 4                   # 与 aux_fix arm 一致（2 卡 DDP × 4 = 有效 batch 8）
num_epochs: 1000000
max_steps: 8050
mixed_precision: "bf16"
use_gradient_checkpointing: true
use_gradient_checkpointing_offload: false
clip_grad_norm: true
log_step: 10
validate_step: 200
resume: false
training_state_dir: "na"
global_step: 0
seed: 42

# --- views -------------------------------------------------------------------
num_source_views: 6
num_target_views: 3
random_permute_source_views: true
view_order: "random"

# --- resolution --------------------------------------------------------------
resolution: [378, 672]

# --- data: RealEstate10K overfit subset（与 aux_fix arm 完全相同的 8 场景）------
kubric4d_root: "/mnt/sfs_turbo/t00845730/re10k/extracted"
manifest_path: "/mnt/sfs_turbo/t00845730/re10k/manifest_train.jsonl"
disparity_norm_mode: "metric"
min_view_valid_fraction: 0.0
samples_per_scene: 8
num_train_samples: 8
dataloader_num_workers: 4

# --- eval --------------------------------------------------------------------
eval_max_samples: 8
eval_batch_size: 2
eval_view_seed: 1234
eval_num_inference_steps: 25
eval_lpips_net: "alex"
eval_sample_seed: 1234
max_checkpoints: 6
