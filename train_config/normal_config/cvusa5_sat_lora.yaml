# CVUSA 5-view street -> satellite, LoRA finetune from multi4_nvs_lora step-4500.
# Based on train_config/normal_config/multi4_nvs_lora.yaml (model/warp/flow
# params kept identical so the pretrained LoRA stays compatible).
# Data: each scene = 5 Waymo-style street views (projected from the CVUSA
# panorama, calibrated rig) + 1 ortho satellite view.  The satellite view
# (view_id "5_SAT") is ALWAYS the generation target; street views are sources.
# Depth: DA3-GIANT pseudo-depth for street views (global scale calibration),
# constant-altitude plane for the satellite camera.

# ===========================================================================
# 平台相关路径
# ===========================================================================
wan_model_root: "/mnt/sfs_turbo/t00845730/wan21"
skip_download: true
output_path: "logs/cvusa5_sat_lora"

model_id_with_origin_paths: "Wan-AI/Wan2.1-I2V-14B-720P:diffusion_pytorch_model*.safetensors,Wan-AI/Wan2.1-T2V-1.3B:Wan2.1_VAE.pth"
strip_i2v_image_input: true

mode: rgbd_nvs
training_target: "x"
denoise_step: 0.5
training_scheduler_timesteps: 1
validation_scheduler_timesteps: 1

trainable_models: "dit"
train_all: false
lora_base_model: "dit"
lora_rank: 128
lora_target_modules: "q,k,v,o,ffn.0,ffn.2"

# --- init from the multi4 NVS LoRA checkpoint (weights only, fresh AdamW) ---
# 注: 原 checkpoint-step-4500 已被该 run 的滚动策略删除(该 run 仍在训练),
# 这里用备份的 step-4800 权重(内容结构相同, 仅多 300 步训练量)
init_model_ckpt: "/mnt/sfs_turbo/t00845730/data/CVUSA_subset/init_ckpt/multi4_nvs_lora_step4800.safetensors"
resume: false
training_state_dir: null
global_step: 0

mixed_precision: "bf16"
learning_rate: 1.0e-4
warmup_steps: 100
lr_decay_steps: 0
lr_min: 0.0

num_epochs: 1000000
max_steps: 500000
max_train_steps: 500000
log_step: 50
clip_grad_norm: true
use_gradient_checkpointing: true
use_gradient_checkpointing_offload: false

# --- Data: CVUSA 5 street + 1 satellite -------------------------------------
dataset_class: cvusa_5sat
kubric4d_root: "/mnt/sfs_turbo/t00845730/data/CVUSA_subset"
manifest_path: cvusa_manifest_train.jsonl
scene_filter: null
split_path: null
train_split: null
eval_split: null
min_view_valid_fraction: 0.0

# 5 street (source) + 1 satellite (target); 3:2 like the Waymo rig
resolution: [256, 384]
num_source_views: 5
num_target_views: 1
samples_per_scene: 1
random_permute_source_views: true
vae_encoding_mode: "independent"
init_dvd_ckpt: null

disparity_norm_mode: "shared_scale"
disparity_norm_quantile: 0.98
disparity_norm_headroom: 1.5

view_condition_plucker_resolution: "pixel"
view_condition_pixel_scale: 8
view_condition_mode: "concat"
view_condition_normalize_moment: true
view_condition_use_role: false

latent_scale: 1.94
depth_latent_scale: 1.68
token_layout: "sequence"
warp_mode: "splat"
warp_dropout_prob: 0.5
warp_two_pass: true

warp_perturb_prob: 0.0
warp_perturb_gain_log_std: 0.34
warp_perturb_shift_std: 0.059
warp_perturb_blur_sigma: 2.0
warp_perturb_lowfreq_std: 0.05
warp_perturb_lowfreq_cells: 6
warp_perturb_fill_invalid: true
warp_perturb_fill_scale: 1.0
per_frame_timestep: true
depth_warp_block: false

rgb_flow_matching: true
rgb_flow_shift: 5.0
rgb_flow_timestep_sampling: "logit_normal"
rgb_flow_logit_mean: 0.0
rgb_flow_logit_std: 1.0

depth_flow_matching: true
depth_head_init: "pretrained"

rgb_loss_weight: 1.0
depth_loss_weight: 1.0
rgb_loss_type: "mse"
depth_loss_type: "mse"

depth_consist_scale_weight: 0.0
depth_consist_repro_weight: 0.0
depth_consist_sigma_max: 0.6
depth_consist_num_views: 3
depth_consist_max_samples: 2
depth_consist_vae_checkpoint: true
depth_consist_min_support: 0.02
depth_consist_ratio_clip: 4.0
depth_consist_trim_quantile: 0.9

clean_source_depth: false
clean_source_depth_prob: 0.5
shared_rope_frame_ids: false
rope_frame_axis: null
rope_pose_translation_scale: null
roce: "off"
camera_geometry_fp32: false
view_order: "random"

batch_size: 1
gradient_accumulation_steps: 4
dataloader_num_workers: 4

seed: 42

# --- Eval / checkpoints ------------------------------------------------------
validate_step: 250
init_validate: false
eval_max_samples: 2
eval_batch_size: 2
eval_view_seed: 1234
eval_sample_seed: 1234
eval_num_inference_steps: 25
eval_flow_shift: 0.5
eval_vis_downscale: 2
eval_vis_format: "jpg"
eval_vis_chunks: 2
max_checkpoints: 3
