<!doctype html><meta charset="utf-8"><title>10场景 Projection 对照</title><style>body{background:#10151c;color:#e9eef5;font:16px/1.6 system-ui;margin:28px auto;max-width:1500px;padding:0 20px}select,button{font:inherit;background:#253449;color:white;padding:8px;border:1px solid #4e6380;border-radius:6px}a{color:#8dcaff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}video{width:100%;background:#06090d;min-height:220px}table{border-collapse:collapse;width:100%;margin:24px 0}td,th{border:1px solid #344358;padding:9px;text-align:left}.muted{color:#a0b1c7}h2{font-size:20px}</style><h1>10 个测试场景 · Control / GAE / RGB projection</h1><p id="status">正在读取进度…</p><p class="muted">Control8200步；GAE/RGB projection6000步。固定6源图→每批3目标，25步采样，seed1234。深度为估计标签；不同训练历史的模型效果对照。</p><p><label>场景 <select id="scene"></select></label> <label>轨迹 <select id="kind"><option value="lateral">左右旋转与横移（RGB/深度）</option><option value="trajectory">真实相机轨迹（GT/预测）</option></select></label> <button id="play">同步从头播放</button> <a href="report.html">实验报告</a> · <a href="metrics.csv">指标CSV</a></p><div class="grid" id="videos"></div><div id="metrics"></div><p class="muted">页面每15秒更新进度；视频生成后即可播放。报告保留全部10个场景。每段视频是相机位置探针序列，不是连续视频生成。</p><script>
let state=null,lastKey='';const arms=['control','gae','rgb'];const labels={control:'Control · 8200',gae:'GAE projection · 6000',rgb:'RGB projection · 6000'};const scene=document.querySelector('#scene'),kind=document.querySelector('#kind');
function render(){if(!state)return;const sid=scene.value;let jobs=state.jobs.filter(j=>j.scene===sid);let key=sid+kind.value+jobs.map(j=>j.status).join();if(key===lastKey)return;lastKey=key;document.querySelector('#videos').innerHTML=arms.map(a=>{let j=jobs.find(j=>j.arm===a),r=j?.result;let path=r?'results/'+sid+'/'+a+'/'+kind.value+'/'+r.videos[kind.value].split('/').pop():'';return '<div><h2>'+labels[a]+'</h2>'+(r?'<video controls preload="metadata" src="'+path+'"></video>':'<p>'+({running:'推理中',pending:'等待推理',failed:'推理失败，详见日志',retry_wait:'等待重试'}[j?.status]||'等待')+'</p>')+'</div>'}).join('');let fields=[['PSNR↑','tgt_rgb_psnr'],['LPIPS↓','tgt_rgb_lpips'],['深度AbsRel↓','tgt_depth_abs_rel_aligned'],['深度δ1↑','tgt_depth_delta1']];document.querySelector('#metrics').innerHTML='<table><tr><th>方法</th>'+fields.map(f=>'<th>'+f[0]+'</th>').join('')+'<th>大角度旋转PSNR↑</th></tr>'+arms.map(a=>{let r=jobs.find(j=>j.arm===a)?.result;return '<tr><td>'+labels[a]+'</td>'+fields.map(f=>'<td>'+(r?r.trajectory[f[1]].toFixed(4):'—')+'</td>').join('')+'<td>'+(r?r.yaw.large15_20_psnr.toFixed(3):'—')+'</td></tr>'}).join('')+'</table>'}
async function update(){try{let r=await fetch('progress.json?t='+Date.now());state=await r.json();document.querySelector('#status').textContent='已完成 '+state.completed+'/'+state.total+' 组（共10场景，每场景3组、每组2段视频）';if(!scene.options.length)scene.innerHTML=state.scenes.map((s,i)=>'<option value="'+s+'">'+(i+1)+' · '+s+'</option>').join('');render()}catch(e){document.querySelector('#status').textContent='等待任务初始化…'}}scene.onchange=render;kind.onchange=render;document.querySelector('#play').onclick=()=>{document.querySelectorAll('video').forEach(v=>{v.currentTime=0;v.play()})};update();setInterval(update,15000);
</script>
